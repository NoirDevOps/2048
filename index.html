<!DOCTYPE html>
<html lang="en" data-mxt-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Please Wait...</title>

<script>
(function () {
  try {
    var stored = localStorage.getItem('mxt-theme');
    if (!stored) {
      localStorage.setItem('mxt-theme', 'dark');
      stored = 'dark';
    }
    if (stored !== 'light') {
      document.documentElement.setAttribute('data-mxt-theme', stored);
    } else {
      document.documentElement.removeAttribute('data-mxt-theme');
    }
  } catch (e) {
    document.documentElement.setAttribute('data-mxt-theme', 'dark');
  }
})();
</script>

<link rel="stylesheet" href="https://noirdevops.github.io/Mixterial/styling/core.css">
<link rel="stylesheet" href="https://noirdevops.github.io/Mixterial/styling/themes/basic/dark.css">
<script src="https://noirdevops.github.io/Mixterial/scripts/core.js" defer></script>

<style>
  html, body {
    height: 100%;
    margin: 0;
    overflow: hidden;
    overscroll-behavior: none;
    background: var(--mxt-bg, #1a1c22);
    color: var(--mxt-fg, #e8eaee);
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: env(safe-area-inset-top, 12px) 12px env(safe-area-inset-bottom, 12px);
    box-sizing: border-box;
    font-family: var(--mxt-font-sans, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif);
  }

  .preloader {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    text-align: center;
    animation: preloader-fade-in 320ms ease-out;
  }

  @keyframes preloader-fade-in {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .preloader-title {
    font-size: clamp(40px, 12vw, 72px);
    font-weight: 800;
    letter-spacing: -0.03em;
    line-height: 1;
    margin: 0;
    color: #f2f3f5;
  }

  .preloader-sub {
    font-size: clamp(12px, 3.2vw, 15px);
    font-weight: 500;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: #a4abb8;
    margin: 0;
    line-height: 1.4;
  }

  .preloader-dots {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    margin-top: 10px;
  }

  .preloader-dots span {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #7f8695;
    animation: preloader-dot 1.2s ease-in-out infinite;
  }

  .preloader-dots span:nth-child(2) { animation-delay: 0.15s; }
  .preloader-dots span:nth-child(3) { animation-delay: 0.3s; }

  @keyframes preloader-dot {
    0%, 80%, 100% { transform: scale(0.6); opacity: 0.5; }
    40% { transform: scale(1); opacity: 1; }
  }

  @media (prefers-reduced-motion: reduce) {
    .preloader,
    .preloader-dots span {
      animation-duration: 0.01ms;
      animation-iteration-count: 1;
    }
  }
</style>
</head>
<body>

<div class="preloader">
  <h3 class="preloader-title">2048</h3>
  <p class="preloader-sub">Loading game, please wait...</p>
  <div class="preloader-dots" aria-hidden="true">
    <span></span>
    <span></span>
    <span></span>
  </div>
</div>

<script>
(function () {
  'use strict';

  var REDIRECT_URL = 'https://noirdevops.github.io/2048/game/main.html';
  var DELAY_MS = 3000;

  function go() {
    window.location.replace(REDIRECT_URL);
  }

  if (document.readyState === 'complete') {
    setTimeout(go, DELAY_MS);
  } else {
    window.addEventListener('load', function () {
      setTimeout(go, DELAY_MS);
    }, { once: true });
  }

  setTimeout(go, DELAY_MS + 1500);
})();
</script>
</body>
</html>
