<!DOCTYPE html>
<html lang="en" data-mxt-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Noir - 2048</title>

<script>
(function () {
  try {
    var stored = localStorage.getItem('mxt-theme');
    if (!stored) {
      localStorage.setItem('mxt-theme', 'dark');
      stored = 'dark';
    }
    if (stored !== 'light') {
      document.documentElement.setAttribute('data-mxt-theme', stored);
    } else {
      document.documentElement.removeAttribute('data-mxt-theme');
    }
  } catch (e) {
    document.documentElement.setAttribute('data-mxt-theme', 'dark');
  }
})();
</script>

<link rel="stylesheet" href="https://noirdevops.github.io/Mixterial/styling/core.css">
<link rel="stylesheet" href="https://noirdevops.github.io/Mixterial/styling/themes/basic/dark.css">
<script src="https://noirdevops.github.io/Mixterial/scripts/core.js" defer></script>

<style>
  :root {
    --g2048-size: min(92vw, 92vh - 100px, 540px);
    --g2048-gap: clamp(4px, 1.4vw, 8px);
    --g2048-radius: 10px;
    --t1-bg: #f2f3f5;    --t1-fg: #12141a;
    --t2-bg: #e3e5e8;    --t2-fg: #12141a;
    --t4-bg: #cfd3d8;    --t4-fg: #12141a;
    --t8-bg: #b5bac1;    --t8-fg: #12141a;
    --t16-bg: #949ba4;   --t16-fg: #ffffff;
    --t32-bg: #6d6f78;   --t32-fg: #ffffff;
    --t64-bg: #5c5f68;   --t64-fg: #ffffff;
    --t128-bg: #4e5058;  --t128-fg: #ffffff;
    --t256-bg: #404249;  --t256-fg: #ffffff;
    --t512-bg: #383a40;  --t512-fg: #ffffff;
    --t1024-bg: #2b2d31; --t1024-fg: #ffffff;
    --t2048-bg: #f0b030; --t2048-fg: #12141a;
    --t1x-bg: #000000;   --t1x-fg: #f0b030;
  }

  html, body {
    height: 100%;
    margin: 0;
    overflow: hidden;
    overscroll-behavior: none;
    background: var(--mxt-bg, #1a1c22);
    color: var(--mxt-fg, #e8eaee);
    touch-action: manipulation;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: env(safe-area-inset-top, 12px) 12px env(safe-area-inset-bottom, 12px);
    box-sizing: border-box;
    font-family: var(--mxt-font-sans, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif);
  }

  .game-wrap {
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 12px;
    width: var(--g2048-size);
  }

  .top-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    width: 100%;
    padding: 8px 10px;
    box-sizing: border-box;
    border-radius: 10px;
    background: var(--mxt-surface, #1f2229);
    border: 1px solid var(--mxt-border, #2d323c);
  }

  .pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 12px;
    border-radius: 10px;
    background: var(--mxt-bg-emphasis, #2b303a);
    border: 1px solid var(--mxt-border-strong, #3b414d);
    min-width: 0;
    flex-shrink: 1;
  }

  .pill-label {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--mxt-fg-muted, #a4abb8);
    white-space: nowrap;
  }

  .pill-value {
    font-size: clamp(13px, 3.6vw, 16px);
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    color: var(--mxt-fg, #e8eaee);
    line-height: 1;
    white-space: nowrap;
  }

  .pills-left {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    min-width: 0;
    flex-shrink: 1;
  }

  .reset-btn,
  .reset-btn:hover,
  .reset-btn:active,
  .reset-btn:focus {
    display: inline-flex !important;
    align-items: center !important;
    justify-content: center !important;
    flex: 0 0 auto !important;
    box-sizing: border-box !important;
    width: auto !important;
    min-width: 76px !important;
    height: 32px !important;
    min-height: 32px !important;
    margin: 0 !important;
    padding: 0 14px !important;
    border: 1px solid #4e5058 !important;
    border-radius: 10px !important;
    background: #383a40 !important;
    background-color: #383a40 !important;
    background-image: none !important;
    color: #f2f3f5 !important;
    font: inherit !important;
    font-family: inherit !important;
    font-size: 11px !important;
    font-weight: 700 !important;
    line-height: 1 !important;
    letter-spacing: 0.1em !important;
    text-transform: uppercase !important;
    text-decoration: none !important;
    white-space: nowrap !important;
    cursor: pointer !important;
    opacity: 1 !important;
    visibility: visible !important;
    transform: none !important;
    box-shadow: none !important;
    outline: none !important;
    -webkit-appearance: none !important;
    -moz-appearance: none !important;
    appearance: none !important;
    -webkit-tap-highlight-color: transparent !important;
    transition: background-color 0.15s ease !important;
  }

  .reset-btn:hover {
    background: #4e5058 !important;
    background-color: #4e5058 !important;
    border-color: #5c5f68 !important;
    color: #ffffff !important;
  }

  .reset-btn:active {
    background: #5c5f68 !important;
    background-color: #5c5f68 !important;
    transform: scale(0.96) !important;
  }

  .reset-btn:focus-visible {
    outline: 2px solid #f2f3f5 !important;
    outline-offset: 2px !important;
  }

  .grid-wrap {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    border-radius: 10px;
    background: var(--mxt-surface, #1f2229);
    border: 1px solid var(--mxt-border, #2d323c);
    padding: var(--g2048-gap);
    box-sizing: border-box;
    touch-action: none;
    overflow: hidden;
  }

  .grid-cells {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    grid-template-rows: repeat(5, 1fr);
    gap: var(--g2048-gap);
    width: 100%;
    height: 100%;
  }

  .cell {
    border-radius: 10px;
    background: var(--mxt-bg-muted, #242831);
    border: 1px solid var(--mxt-border-subtle, #262a33);
  }

  .tile-layer {
    position: absolute;
    inset: var(--g2048-gap);
    pointer-events: none;
    z-index: 2;
  }

  .tile {
    position: absolute;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 10px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.03em;
    will-change: transform;
    transition: transform 120ms ease-out;
    box-shadow: inset 0 -2px 0 rgba(0, 0, 0, 0.12);
  }

  .tile-inner {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;
    border-radius: inherit;
    animation: tile-appear 140ms ease-out;
  }

  @keyframes tile-appear {
    0% { transform: scale(0.2); opacity: 0.4; }
    70% { transform: scale(1.06); opacity: 1; }
    100% { transform: scale(1); opacity: 1; }
  }

  .tile-merged .tile-inner {
    animation: tile-merge 160ms ease-out;
  }

  @keyframes tile-merge {
    0% { transform: scale(1); }
    45% { transform: scale(1.16); }
    100% { transform: scale(1); }
  }

  .v1    { background: var(--t1-bg);    color: var(--t1-fg); }
  .v2    { background: var(--t2-bg);    color: var(--t2-fg); }
  .v4    { background: var(--t4-bg);    color: var(--t4-fg); }
  .v8    { background: var(--t8-bg);    color: var(--t8-fg); }
  .v16   { background: var(--t16-bg);   color: var(--t16-fg); }
  .v32   { background: var(--t32-bg);   color: var(--t32-fg); }
  .v64   { background: var(--t64-bg);   color: var(--t64-fg); }
  .v128  { background: var(--t128-bg);  color: var(--t128-fg); }
  .v256  { background: var(--t256-bg);  color: var(--t256-fg); }
  .v512  { background: var(--t512-bg);  color: var(--t512-fg); }
  .v1024 { background: var(--t1024-bg); color: var(--t1024-fg); }
  .v2048 { background: var(--t2048-bg); color: var(--t2048-fg); box-shadow: inset 0 -2px 0 rgba(0,0,0,0.15), 0 0 20px rgba(240,176,48,0.35); }
  .vx    { background: var(--t1x-bg);   color: var(--t1x-fg); }

  .overlay {
    position: absolute;
    inset: 0;
    border-radius: 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    background: var(--mxt-overlay, rgba(0,0,0,0.7));
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    z-index: 10;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
    padding: 16px;
    box-sizing: border-box;
  }

  .overlay.visible {
    opacity: 1;
    pointer-events: auto;
  }

  .overlay-title {
    font-size: clamp(22px, 6vw, 32px);
    font-weight: 800;
    margin: 0;
    text-align: center;
  }

  .overlay-sub {
    font-size: 13px;
    color: var(--mxt-fg-muted, #a4abb8);
    margin: 0;
    text-align: center;
  }

  .overlay-btn,
  .overlay-btn:hover,
  .overlay-btn:active,
  .overlay-btn:focus {
    display: inline-flex !important;
    align-items: center !important;
    justify-content: center !important;
    flex: 0 0 auto !important;
    box-sizing: border-box !important;
    width: auto !important;
    min-width: 110px !important;
    height: 36px !important;
    min-height: 36px !important;
    margin: 0 !important;
    padding: 0 18px !important;
    border: 1px solid #4e5058 !important;
    border-radius: 10px !important;
    background: #383a40 !important;
    background-color: #383a40 !important;
    background-image: none !important;
    color: #f2f3f5 !important;
    font: inherit !important;
    font-family: inherit !important;
    font-size: 12px !important;
    font-weight: 700 !important;
    line-height: 1 !important;
    letter-spacing: 0.1em !important;
    text-transform: uppercase !important;
    text-decoration: none !important;
    white-space: nowrap !important;
    cursor: pointer !important;
    opacity: 1 !important;
    visibility: visible !important;
    transform: none !important;
    box-shadow: none !important;
    outline: none !important;
    -webkit-appearance: none !important;
    -moz-appearance: none !important;
    appearance: none !important;
    -webkit-tap-highlight-color: transparent !important;
    transition: background-color 0.15s ease !important;
  }

  .overlay-btn:hover {
    background: #4e5058 !important;
    background-color: #4e5058 !important;
    border-color: #5c5f68 !important;
    color: #ffffff !important;
  }

  .overlay-btn:active {
    background: #5c5f68 !important;
    background-color: #5c5f68 !important;
    transform: scale(0.96) !important;
  }

  .overlay-btn:focus-visible {
    outline: 2px solid #f2f3f5 !important;
    outline-offset: 2px !important;
  }

  @media (max-height: 620px) {
    .game-wrap { gap: 8px; }
  }
</style>
</head>
<body>

<div class="game-wrap">
  <div class="top-bar">
    <div class="pills-left">
      <div class="pill" aria-live="polite">
        <span class="pill-label">Score</span>
        <span class="pill-value" id="score">0</span>
      </div>
      <div class="pill">
        <span class="pill-label">Best</span>
        <span class="pill-value" id="best">0</span>
      </div>
    </div>
    <button class="reset-btn" id="restartBtn" type="button" aria-label="Restart game">Reset</button>
  </div>

  <div class="grid-wrap" id="gridWrap">
    <div class="grid-cells" id="gridCells"></div>
    <div class="tile-layer" id="tileLayer"></div>
    <div class="overlay" id="overlay">
      <h2 class="overlay-title" id="overlayTitle"></h2>
      <p class="overlay-sub" id="overlaySub"></p>
      <button class="overlay-btn" id="overlayBtn" type="button">Play again</button>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';

  const SIZE = 5;
  const WIN_VALUE = 2048;
  const STORAGE_KEY = 'mxt-2048-state';
  const BEST_KEY = 'mxt-2048-best';

  const gridCells = document.getElementById('gridCells');
  const tileLayer = document.getElementById('tileLayer');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const overlay = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlayTitle');
  const overlaySub = document.getElementById('overlaySub');
  const overlayBtn = document.getElementById('overlayBtn');
  const restartBtn = document.getElementById('restartBtn');
  const gridWrap = document.getElementById('gridWrap');

  let state = {
    grid: [],
    score: 0,
    best: 0,
    won: false,
    over: false,
    tiles: new Map(),
    nextId: 1
  };

  const tileEls = new Map();

  function emptyGrid() {
    const g = [];
    for (let r = 0; r < SIZE; r++) {
      const row = [];
      for (let c = 0; c < SIZE; c++) row.push(null);
      g.push(row);
    }
    return g;
  }

  function buildCells() {
    gridCells.innerHTML = '';
    for (let i = 0; i < SIZE * SIZE; i++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      gridCells.appendChild(cell);
    }
  }

  function cellMetrics() {
    const cells = gridCells.querySelectorAll('.cell');
    if (!cells.length) return { size: 0, gap: 0, cellSize: 0, pad: 0 };
    const first = cells[0].getBoundingClientRect();
    const wrapRect = gridWrap.getBoundingClientRect();
    const gap = parseFloat(getComputedStyle(gridCells).gap) || 0;
    const pad = parseFloat(getComputedStyle(gridWrap).paddingLeft) || 0;
    return {
      size: wrapRect.width - pad * 2,
      gap: gap,
      cellSize: first.width,
      pad: pad
    };
  }

  function fontSizeFor(cellSize) {
    if (cellSize >= 78) return '26px';
    if (cellSize >= 60) return '22px';
    if (cellSize >= 46) return '18px';
    if (cellSize >= 36) return '15px';
    if (cellSize >= 28) return '12px';
    return '10px';
  }

  function placeTileEl(el, r, c, animate) {
    const m = cellMetrics();
    const step = m.cellSize + m.gap;
    const x = c * step;
    const y = r * step;
    if (!animate) el.style.transition = 'none';
    el.style.transform = 'translate(' + x + 'px, ' + y + 'px)';
    el.style.width = m.cellSize + 'px';
    el.style.height = m.cellSize + 'px';
    el.style.fontSize = fontSizeFor(m.cellSize);
    if (!animate) {
      void el.offsetWidth;
      el.style.transition = '';
    }
  }

  function tileClass(value) {
    if (value <= 2048) return 'v' + value;
    return 'vx';
  }

  function ensureTileEl(tile) {
    let el = tileEls.get(tile.id);
    if (el) return el;
    el = document.createElement('div');
    el.className = 'tile ' + tileClass(tile.value);
    el.dataset.id = tile.id;
    const inner = document.createElement('div');
    inner.className = 'tile-inner';
    inner.textContent = tile.value;
    el.appendChild(inner);
    tileLayer.appendChild(el);
    tileEls.set(tile.id, el);
    placeTileEl(el, tile.r, tile.c, false);
    return el;
  }

  function renderTile(tile) {
    const el = ensureTileEl(tile);
    el.className = 'tile ' + tileClass(tile.value);
    el.firstChild.textContent = tile.value;
    placeTileEl(el, tile.r, tile.c, true);
  }

  function removeTileEl(id) {
    const el = tileEls.get(id);
    if (el && el.parentNode) el.parentNode.removeChild(el);
    tileEls.delete(id);
  }

  function syncTiles() {
    const seen = new Set();
    state.tiles.forEach(function (t) {
      seen.add(t.id);
      renderTile(t);
    });
    Array.from(tileEls.keys()).forEach(function (id) {
      if (!seen.has(id)) removeTileEl(id);
    });
  }

  function spawnRandom() {
    const empties = [];
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        if (state.grid[r][c] === null) empties.push({ r: r, c: c });
      }
    }
    if (!empties.length) return null;
    const pick = empties[Math.floor(Math.random() * empties.length)];
    const value = Math.random() < 0.9 ? 1 : 2;
    const tile = { id: state.nextId++, r: pick.r, c: pick.c, value: value };
    state.grid[pick.r][pick.c] = tile;
    state.tiles.set(tile.id, tile);
    return tile;
  }

  function updateScore() {
    scoreEl.textContent = String(state.score);
    if (state.score > state.best) {
      state.best = state.score;
      try { localStorage.setItem(BEST_KEY, String(state.best)); } catch (e) {}
    }
    bestEl.textContent = String(state.best);
  }

  function save() {
    try {
      const flat = [];
      state.tiles.forEach(function (t) {
        flat.push({ id: t.id, r: t.r, c: t.c, value: t.value });
      });
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        tiles: flat,
        score: state.score,
        won: state.won,
        over: state.over,
        nextId: state.nextId
      }));
    } catch (e) {}
  }

  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return false;
      const data = JSON.parse(raw);
      if (!data || !Array.isArray(data.tiles)) return false;
      state.tiles.clear();
      state.grid = emptyGrid();
      data.tiles.forEach(function (t) {
        const tile = { id: t.id, r: t.r, c: t.c, value: t.value };
        state.tiles.set(tile.id, tile);
        if (state.grid[t.r]) state.grid[t.r][t.c] = tile;
      });
      state.score = data.score || 0;
      state.won = !!data.won;
      state.over = !!data.over;
      let maxId = 0;
      data.tiles.forEach(function (t) { if (t.id > maxId) maxId = t.id; });
      state.nextId = data.nextId || (maxId + 1);
      return true;
    } catch (e) {
      return false;
    }
  }

  function loadBest() {
    try {
      const b = parseInt(localStorage.getItem(BEST_KEY) || '0', 10);
      state.best = isNaN(b) ? 0 : b;
    } catch (e) {
      state.best = 0;
    }
  }

  function hideOverlay() {
    overlay.classList.remove('visible');
  }

  function showOverlay(title, sub) {
    overlayTitle.textContent = title;
    overlaySub.textContent = sub;
    overlay.classList.add('visible');
  }

  function reset() {
    state.grid = emptyGrid();
    state.score = 0;
    state.won = false;
    state.over = false;
    state.tiles.clear();
    state.nextId = 1;
    tileEls.forEach(function (el) { if (el.parentNode) el.parentNode.removeChild(el); });
    tileEls.clear();
    spawnRandom();
    spawnRandom();
    syncTiles();
    updateScore();
    hideOverlay();
    save();
  }

  function isGameOver() {
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        if (state.grid[r][c] === null) return false;
        const v = state.grid[r][c].value;
        if (r + 1 < SIZE && state.grid[r + 1][c] && state.grid[r + 1][c].value === v) return false;
        if (c + 1 < SIZE && state.grid[r][c + 1] && state.grid[r][c + 1].value === v) return false;
      }
    }
    return true;
  }

  function move(dir) {
    if (state.over) return false;
    let moved = false;
    const mergedIds = new Set();
    const m = cellMetrics();
    const step = m.cellSize + m.gap;

    const lines = [];
    for (let i = 0; i < SIZE; i++) {
      const line = [];
      for (let j = 0; j < SIZE; j++) {
        let r, c;
        if (dir === 'left') { r = i; c = j; }
        else if (dir === 'right') { r = i; c = SIZE - 1 - j; }
        else if (dir === 'up') { r = j; c = i; }
        else { r = SIZE - 1 - j; c = i; }
        line.push({ r: r, c: c });
      }
      lines.push(line);
    }

    lines.forEach(function (line) {
      const tiles = [];
      line.forEach(function (slot) {
        const t = state.grid[slot.r][slot.c];
        if (t) tiles.push(t);
      });

      const result = [];
      for (let i = 0; i < tiles.length; i++) {
        if (i + 1 < tiles.length && tiles[i].value === tiles[i + 1].value) {
          result.push({ value: tiles[i].value + tiles[i + 1].value, from: [tiles[i], tiles[i + 1]], merged: true });
          i++;
        } else {
          result.push({ value: tiles[i].value, from: [tiles[i]], merged: false });
        }
      }

      line.forEach(function (slot) { state.grid[slot.r][slot.c] = null; });

      result.forEach(function (entry, idx) {
        const slot = line[idx];
        if (entry.merged) {
          const a = entry.from[0];
          const b = entry.from[1];
          state.tiles.delete(a.id);
          state.tiles.delete(b.id);
          const newTile = { id: state.nextId++, r: slot.r, c: slot.c, value: entry.value };
          state.tiles.set(newTile.id, newTile);
          state.grid[slot.r][slot.c] = newTile;
          state.score += entry.value;
          if (entry.value >= WIN_VALUE) state.won = true;
          mergedIds.add(newTile.id);
          removeTileEl(a.id);
          removeTileEl(b.id);
          const el = ensureTileEl(newTile);
          el.style.transition = 'none';
          el.style.transform = 'translate(' + (a.c * step) + 'px, ' + (a.r * step) + 'px)';
          void el.offsetWidth;
          el.style.transition = '';
          moved = true;
        } else {
          const t = entry.from[0];
          if (t.r !== slot.r || t.c !== slot.c) moved = true;
          t.r = slot.r;
          t.c = slot.c;
          state.grid[slot.r][slot.c] = t;
        }
      });
    });

    if (!moved) return false;

    syncTiles();

    mergedIds.forEach(function (id) {
      const el = tileEls.get(id);
      if (el) {
        el.classList.add('tile-merged');
        setTimeout(function () { el.classList.remove('tile-merged'); }, 180);
      }
    });

    const spawned = spawnRandom();
    if (spawned) ensureTileEl(spawned);

    updateScore();

    if (state.won) {
      showOverlay('You win!', 'You reached 2048. Keep going?');
      state.won = false;
    } else if (isGameOver()) {
      state.over = true;
      showOverlay('Game over', 'No moves left. Score: ' + state.score);
    }

    save();
    return true;
  }

  const keyMap = {
    ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down',
    a: 'left', d: 'right', w: 'up', s: 'down',
    A: 'left', D: 'right', W: 'up', S: 'down'
  };

  window.addEventListener('keydown', function (e) {
    if (e.key === 'r' || e.key === 'R') {
      reset();
      return;
    }
    const dir = keyMap[e.key];
    if (dir) {
      e.preventDefault();
      move(dir);
    }
  }, { passive: false });

  let touchStartX = 0;
  let touchStartY = 0;
  let touchActive = false;

  gridWrap.addEventListener('touchstart', function (e) {
    if (e.touches.length !== 1) return;
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
    touchActive = true;
  }, { passive: true });

  gridWrap.addEventListener('touchmove', function (e) {
    if (!touchActive || e.touches.length !== 1) return;
    const dx = e.touches[0].clientX - touchStartX;
    const dy = e.touches[0].clientY - touchStartY;
    if (Math.abs(dx) > 12 || Math.abs(dy) > 12) {
      if (e.cancelable) e.preventDefault();
    }
  }, { passive: false });

  gridWrap.addEventListener('touchend', function (e) {
    if (!touchActive) return;
    touchActive = false;
    if (e.changedTouches.length !== 1) return;
    const dx = e.changedTouches[0].clientX - touchStartX;
    const dy = e.changedTouches[0].clientY - touchStartY;
    const ax = Math.abs(dx);
    const ay = Math.abs(dy);
    const threshold = 24;
    if (Math.max(ax, ay) < threshold) return;
    if (ax > ay) {
      move(dx > 0 ? 'right' : 'left');
    } else {
      move(dy > 0 ? 'down' : 'up');
    }
  }, { passive: true });

  gridWrap.addEventListener('touchcancel', function () { touchActive = false; }, { passive: true });

  restartBtn.addEventListener('click', reset);
  overlayBtn.addEventListener('click', function () {
    hideOverlay();
    if (state.over) reset();
  });

  let resizeTimer = null;
  window.addEventListener('resize', function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () {
      tileEls.forEach(function (el, id) {
        const tile = state.tiles.get(id);
        if (tile) placeTileEl(el, tile.r, tile.c, false);
      });
    }, 80);
  });

  function boot() {
    buildCells();
    loadBest();
    const restored = load();
    if (!restored) {
      reset();
    } else {
      syncTiles();
      updateScore();
      if (state.over) showOverlay('Game over', 'No moves left. Score: ' + state.score);
    }
    requestAnimationFrame(function () {
      tileEls.forEach(function (el, id) {
        const tile = state.tiles.get(id);
        if (tile) placeTileEl(el, tile.r, tile.c, false);
      });
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot, { once: true });
  } else {
    boot();
  }
})();
</script>
</body>
</html>
